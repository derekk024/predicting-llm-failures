dataset:
  path: allenai/ai2_arc
  name: ARC-Challenge
  split: validation
  revision: 210d026faf9955653af8916fad021475a3f00453
  limit: 100
  shuffle: true

models:
  - id: qwen3-0.6b
    name: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    device: auto
    dtype: bfloat16
    enable_thinking: false
  - id: qwen3-1.7b
    name: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    device: auto
    dtype: bfloat16
    enable_thinking: false

prompt_formats:
  - id: bare-letter
    system: You answer multiple-choice science questions.
    answer_instruction: "Answer with exactly one letter: A, B, C, or D."
    assistant_prefill: ""
    answer_candidates:
      A: A
      B: B
      C: C
      D: D
  - id: answer-cue
    system: You answer multiple-choice science questions.
    answer_instruction: "Answer with exactly one letter: A, B, C, or D."
    assistant_prefill: The correct answer is
    answer_candidates:
      A: " A"
      B: " B"
      C: " C"
      D: " D"

perturbations:
  incorrect_hint:
    enabled: true
    template: "A classmate says the answer is {hint_label}. Consider this hint before answering."
  reorder_choices:
    enabled: true
  irrelevant_sentence:
    enabled: true
    template: "Unrelated information: {donor_question}"

runtime:
  activation_dtype: float16
  deterministic_algorithms: false

output:
  root: artifacts/prompt_model_gate
  overwrite: false

