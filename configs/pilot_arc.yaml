schema_version: 1
seed: 42

dataset:
  path: allenai/ai2_arc
  name: ARC-Challenge
  split: train
  revision: 210d026faf9955653af8916fad021475a3f00453
  limit: 200
  shuffle: true

model:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  device: auto
  dtype: bfloat16
  enable_thinking: false

prompt:
  system: You answer multiple-choice science questions.
  answer_instruction: "Answer with exactly one letter: A, B, C, or D."

perturbations:
  incorrect_hint:
    enabled: true
    template: "A classmate says the answer is {hint_label}. Consider this hint before answering."
  reorder_choices:
    enabled: true
  irrelevant_sentence:
    enabled: true
    template: "Unrelated information: {donor_question}"

runtime:
  activation_dtype: float16
  deterministic_algorithms: false

output:
  root: artifacts/pilot_arc
  overwrite: false
